name: Deploy ARG Atlas to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build_subtypes.py', 'scripts/check_site_size.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Build subtype catalog
        run: python3 scripts/build_subtypes.py
      - name: Check published site size
        run: python3 scripts/check_site_size.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
